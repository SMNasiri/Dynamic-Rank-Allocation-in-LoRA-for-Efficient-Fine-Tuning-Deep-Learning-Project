[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stability-aware-adalora"
version = "0.2.0"
description = "MSc research scaffold for stability-aware continuous rank pruning in AdaLoRA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "peft==0.20.0",
  "datasets>=3.0",
  "evaluate>=0.4",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "sentencepiece>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["stability_adalora"]
